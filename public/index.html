<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Leave Portal</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <h2>GPC Student Leave Form</h2>
        <form action="/.netlify/functions/api/submit" method="POST">
            <label>Full Name</label>
            <input type="text" name="name" required>
            <label>Enrollment Number</label>
            <input type="text" name="enrollment" required>
            <label>Branch</label>
            <select name="branch" required>
                <option value="Computer Science">Computer Science</option>
                <option value="Mechanical">Mechanical</option>
                <option value="Civil">Civil</option>
                <option value="Electrical">Electrical</option>
            </select>
            <label>Reason</label>
            <textarea name="reason" rows="3" required></textarea>
            <label>Days</label>
            <input type="number" name="days" required>
            <button type="submit" class="btn-submit">Submit Application</button>
        </form>
        <div style="display:flex; justify-content: space-around;">
            <a href="/admin-panel" class="footer-link">Sign-in as Admin</a>
            <a href="/about" class="footer-link">About Me</a>
        </div>
    </div>
</body>

</html>
